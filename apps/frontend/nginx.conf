server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Encaminha as chamadas de API para o container do back-end na rede do
  # compose, evitando CORS: o navegador só fala com esta mesma origem.
  location /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # SPA: qualquer rota desconhecida cai no index.html (Angular Router assume).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
