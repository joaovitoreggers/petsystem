<div class="login-page">
  <form class="login-card" (ngSubmit)="login()" #loginForm="ngForm">
    <h1>PET Digital</h1>
    <p class="subtitle">Doorkeeper / operator access</p>

    <label for="email">Email</label>
    <input
      id="email"
      name="email"
      type="email"
      [(ngModel)]="email"
      required
      autocomplete="username"
    />

    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      [(ngModel)]="password"
      required
      autocomplete="current-password"
    />

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="loginForm.invalid || loading()">
      {{ loading() ? 'Signing in...' : 'Sign in' }}
    </button>
  </form>
</div>
